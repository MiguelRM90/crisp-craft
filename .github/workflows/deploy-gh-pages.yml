name: Deploy CrispCraft PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Checkout pwa-ui-core library
        run: git clone --depth 1 https://github.com/MiguelRM90/pwa-ui-core.git ../pwa-ui-core

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ETL Catalog Partitioner
        run: pnpm run etl:build

      - name: Run Thermodynamic Engine Unit Tests
        run: pnpm test

      - name: Build Angular PWA for GitHub Pages
        run: |
          pnpm run build:gh-pages
          # SPA 404 fallback for GitHub Pages
          if [ -d "dist/crisp-craft/browser" ]; then
            cp dist/crisp-craft/browser/index.html dist/crisp-craft/browser/404.html
          elif [ -d "dist/crisp-craft" ]; then
            cp dist/crisp-craft/index.html dist/crisp-craft/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/crisp-craft/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
